name: Feature request
description: A research question the tools cannot answer yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tools that write to SNAC, or that fetch ArchiveGrid, will not be merged. See "Out of scope, by decision" in [docs/DESIGN.md](https://github.com/ianderso/snac-archives-mcp/blob/main/docs/DESIGN.md).
  - type: textarea
    id: problem
    attributes:
      label: The research problem
      description: What you were trying to find or read, and where the current tools stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new tool, a new parameter, or a change to what a tool returns.
  - type: textarea
    id: api
    attributes:
      label: SNAC API command or parameter
      description: If you know which command would answer it. docs/API-NOTES.md lists what the server sends and what was observed of it.
